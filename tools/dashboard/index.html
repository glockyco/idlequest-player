<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>IdleQuest account</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header id="status" class="status"></header>
    <main>
      <div class="pair">
        <section class="panel" id="needs">
          <h2>Needs you</h2>
          <div id="needs-list"></div>
          <p id="needs-handled" class="muted small"></p>
        </section>
        <section class="panel" id="goal">
          <h2>Goal progress</h2>
          <div id="goal-bars"></div>
        </section>
      </div>

      <section id="groups">
        <div class="head">
          <h2>Groups</h2>
          <div id="act-legend" class="legend"></div>
        </div>
        <div class="scroll"><table id="group-table" class="groups"></table></div>
      </section>

      <section id="progress" class="panel">
        <div class="head">
          <h2>Progress</h2>
          <div id="progress-filters" class="filters"></div>
        </div>
        <div id="progress-list" class="feed"></div>
      </section>

      <section id="gear">
        <div class="head">
          <h2>Gear</h2>
          <label class="muted small">Character sheet <select id="gear-select"></select></label>
          <span class="legend"><span><i class="swatch now"></i>worn now</span><span><i class="swatch after"></i>after the queued moves</span><span>track: with the wanted drops</span></span>
        </div>
        <div id="gear-rows" class="gear-rows"></div>
        <div id="sheet" class="panel sheet"></div>
        <div class="panel">
          <h3>Most wanted</h3>
          <div class="scroll" id="wanted"></div>
        </div>
      </section>

      <div class="pair">
        <section class="panel" id="coordinator">
          <h2>Coordinator</h2>
          <div id="coord"></div>
        </section>
        <section class="panel" id="time">
          <h2>Where time goes</h2>
          <div id="time-body"></div>
        </section>
      </div>

      <details id="d-epics">
        <summary>Epic chains</summary>
        <div id="epics"></div>
      </details>
      <details id="d-eng">
        <summary>Engineering health</summary>
        <div id="eng-charts" class="split"></div>
        <div id="eng-table"></div>
        <h3>Manual steps</h3>
        <div id="manual"></div>
      </details>
      <details id="d-roster">
        <summary>Roster</summary>
        <div id="roster"></div>
      </details>
      <details id="d-trends">
        <summary>Level trends</summary>
        <div class="controls">
          Level of each group's leader over the last
          <select id="trend-hours">
            <option value="6">6 hours</option>
            <option value="24" selected>24 hours</option>
            <option value="72">3 days</option>
            <option value="168">7 days</option>
          </select>
        </div>
        <div id="trend-chart"></div>
      </details>
      <details id="d-jobs">
        <summary>Experiments and jobs</summary>
        <div id="jobs-list"></div>
      </details>
      <details id="d-alerts">
        <summary>Alert history</summary>
        <div id="alerts"></div>
      </details>
    </main>
    <div id="tip" class="tip" hidden></div>
    <script src="/gear.js"></script>
    <script src="/app.js"></script>
  </body>
</html>
